ormal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="48.60">Every</tspan><tspan x="71.84">corner</tspan><tspan x="97.15">of</tspan><tspan x="106.39">the</tspan><tspan x="119.80">icosahedron</tspan><tspan x="166.05">sits</tspan><tspan x="180.09">at</tspan><tspan x="188.90">a</tspan><tspan x="195.05">combination</tspan><tspan x="242.48">of</tspan><tspan x="251.73">0,</tspan><tspan x="259.92">±1</tspan><tspan x="270.15">and</tspan><tspan x="286.06">±φ,</tspan><tspan x="300.04">where</tspan><tspan x="324.76">φ</tspan><tspan x="332.60">=</tspan><tspan x="338.74">1.618034</tspan><tspan x="369.45">.</tspan><tspan x="373.54">One</tspan><tspan x="390.71">vertex</tspan><tspan x="415.22">is</tspan><tspan x="423.12">marked.</tspan></text><text y="401.76" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.40" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="48.60">Rendered</tspan><tspan x="77.31">by</tspan><tspan x="85.89">the</tspan><tspan x="96.73">DomeSim</tspan><tspan x="125.93">film</tspan><tspan x="138.25">engine</tspan><tspan x="159.18">from</tspan><tspan x="174.36">“2V</tspan><tspan x="185.91">Geodesic</tspan><tspan x="213.38">Masterclass”,</tspan><tspan x="251.44">chapter</tspan><tspan x="274.44">“phi”,</tspan><tspan x="291.27">92%</tspan><tspan x="305.11">through.</tspan><tspan x="330.92">The</tspan><tspan x="342.95">coordinates</tspan><tspan x="377.68">scene</tspan><tspan x="395.35">with</tspan><tspan x="409.01">its</tspan><tspan x="417.17">axes</tspan><tspan x="431.12">and</tspan><tspan x="443.47">one</tspan><tspan x="455.89">vertex</tspan><tspan x="474.66">labelled.</tspan></text><rect x="48.60" y="419.46" width="482.40" height="209.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="436.30" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="449.39" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">Twelve</tspan><tspan x="91.11">points</tspan><tspan x="122.22">from</tspan><tspan x="146.86">one</tspan><tspan x="166.73">ratio</tspan></text><text y="461.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">start with one number and nothing else:</tspan></text><text y="471.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">phi = (1 + sqrt 5) / 2 = 1.618033989</tspan></text><text y="481.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  phi is the number whose square is itself plus one</tspan></text><text y="491.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">build 12 points by putting 0, +/-1 and +/-phi in every order:</tspan></text><text y="501.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  (0, +/-1, +/-phi), (+/-1, +/-phi, 0), (+/-phi, 0, +/-1)</tspan></text><text y="511.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  3 families x 4 sign choices = 12 points</tspan></text><text y="521.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">measure the closest pair of those points:</tspan></text><text y="531.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  nearest-neighbour distance = 2.000000000</tspan></text><text y="541.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">measure each point&#x27;s distance from the centre:</tspan></text><text y="551.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  |v| = sqrt(1 + phi^2) = 1.902113033  (all 12 the same)</tspan></text><text y="561.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  |v| means length: sqrt(x^2 + y^2 + z^2)</tspan></text><text y="571.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">every point is 2.000 from its neighbours and 1.902113 from the middle</tspan></text><rect x="54.60" y="577.06" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="590.42" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">One</tspan><tspan x="79.10">irrational</tspan><tspan x="116.92">number</tspan><tspan x="149.97">places</tspan><tspan x="176.65">twelve</tspan><tspan x="204.34">points</tspan><tspan x="231.18">in</tspan><tspan x="240.84">perfectly</tspan><tspan x="277.73">even</tspan><tspan x="298.61">space</tspan><tspan x="322.93">--</tspan><tspan x="332.24">that</tspan><tspan x="350.36">is</tspan><tspan x="358.70">an</tspan><tspan x="370.61">icosahedron,</tspan><tspan x="422.84">and</tspan><tspan x="439.94">it</tspan><tspan x="447.68">is</tspan><tspan x="456.02">the</tspan><tspan x="471.11">entire</tspan></text><text y="602.02" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">starting</tspan><tspan x="93.35">stock</tspan><tspan x="116.24">of</tspan><tspan x="126.59">the</tspan><tspan x="141.68">dome.</tspan></text><text y="620.15" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="57.60">Computed</tspan><tspan x="88.81">by</tspan><tspan x="97.31">two_v_demo.scratch_facts.steps_phi.</tspan><tspan x="199.07">Every</tspan><tspan x="215.57">line</tspan><tspan x="227.23">above</tspan><tspan x="245.90">is</tspan><tspan x="251.84">printed</tspan><tspan x="273.73">by</tspan><tspan x="282.23">that</tspan><tspan x="295.02">code</tspan><tspan x="310.38">when</tspan><tspan x="327.12">the</tspan><tspan x="337.86">book</tspan><tspan x="353.84">is</tspan><tspan x="359.77">built;</tspan><tspan x="375.35">none</tspan><tspan x="391.22">of</tspan><tspan x="398.63">it</tspan><tspan x="404.03">is</tspan><tspan x="409.96">typed.</tspan></text><text y="693.00" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.00" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="48.60">12</tspan></text><text y="42.12" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="600" fill="#6c655a" xml:space="preserve"><tspan x="48.60">DOMOLOGY · BOOK ONE · THE DOME</tspan></text><line x1="48.60" y1="47.62" x2="531.00" y2="47.62" stroke="#cfc7ba" stroke-width="0.35" stroke-linecap="round"/></svg></div><div class="sheet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585.00 738.00" width="585.00pt" height="738.00pt" data-page="24" data-folio="13"><rect x="0" y="0" width="585.00" height="738.00" fill="#ffffff"/><rect x="54.00" y="63.00" width="482.40" height="199.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="79.84" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="63.00">WORKED</tspan><tspan x="94.70">MATH</tspan></text><text y="92.93" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">Onto</tspan><tspan x="88.67">the</tspan><tspan x="106.16">sphere</tspan></text><text y="105.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">the 12 raw points sit on a sphere of an awkward radius:</tspan></text><text y="115.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  |v| = 1.902113033   (not 1, not anything useful)</tspan></text><text y="125.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">divide every point by its own length -- &#x27;normalize&#x27;:</tspan></text><text y="135.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  v_hat = v / |v|     same direction, length set to 1</tspan></text><text y="145.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  check: every point is now at radius 1.000000000 to 1.000000000</tspan></text><text y="155.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">the edge that measured 2.000000 becomes:</tspan></text><text y="165.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  2 / sqrt(1 + phi^2) = 1.051462224</tspan></text><text y="175.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">that number is a CHORD FACTOR: a multiplier, not a length</tspan></text><text y="185.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  length in inches = chord factor x radius in inches</tspan></text><text y="195.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">so the model is unit-free -- pick the size later, once, and</tspan></text><text y="205.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  the same numbers serve a playhouse and a hangar</tspan></text><rect x="60.00" y="210.60" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="223.96" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="66.00">Normalizing</tspan><tspan x="116.46">turns</tspan><tspan x="138.93">one</tspan><tspan x="156.06">specific</tspan><tspan x="187.52">solid</tspan><tspan x="208.47">into</tspan><tspan x="226.34">a</tspan><tspan x="233.21">reusable</tspan><tspan x="268.57">recipe:</tspan><tspan x="296.80">every</tspan><tspan x="320.57">distance</tspan><tspan x="355.40">becomes</tspan><tspan x="392.69">a</tspan><tspan x="399.57">multiple</tspan><tspan x="434.26">of</tspan><tspan x="444.62">a</tspan><tspan x="451.49">radius</tspan><tspan x="477.76">you</tspan><tspan x="494.63">have</tspan></text><text y="235.56" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="66.00">not</tspan><tspan x="81.67">chosen</tspan><tspan x="111.60">yet.</tspan></text><text y="253.69" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="63.00">Computed</tspan><tspan x="94.21">by</tspan><tspan x="102.71">two_v_demo.scratch_facts.steps_normalize.</tspan><tspan x="222.99">Every</tspan><tspan x="239.48">line</tspan><tspan x="251.14">above</tspan><tspan x="269.82">is</tspan><tspan x="275.76">printed</tspan><tspan x="297.65">by</tspan><tspan x="306.14">that</tspan><tspan x="318.94">code</tspan><tspan x="334.30">when</tspan><tspan x="351.03">the</tspan><tspan x="361.78">book</tspan><tspan x="377.75">is</tspan><tspan x="383.69">built;</tspan><tspan x="399.27">none</tspan><tspan x="415.14">of</tspan><tspan x="422.55">it</tspan><tspan x="427.94">is</tspan><tspan x="433.88">typed.</tspan></text><rect x="54.00" y="278.46" width="482.40" height="197.80" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="295.30" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="63.00">WORKED</tspan><tspan x="94.70">MATH</tspan></text><text y="308.39" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">Euler&#x27;s</tspan><tspan x="94.88">count</tspan></text><text y="320.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">the icosahedron, counted off the model on the left:</tspan></text><text y="330.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  V = corners        = 12</tspan></text><text y="340.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  F = triangle faces = 20</tspan></text><text y="350.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">every face has 3 sides and every side is shared by 2 faces:</tspan></text><text y="360.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  E = F x 3 / 2 = 20 x 3 / 2 = 30</tspan></text><text y="370.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  counted directly off the model: E = 30</tspan></text><text y="380.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">Euler&#x27;s rule, true of any closed surface without holes:</tspan></text><text y="390.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  V - E + F = 12 - 30 + 20 = 2</tspan></text><text y="400.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  a closed surface always gives 2 -- anything else is a bug:</tspan></text><text y="410.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  a missing face, a doubled corner, a hole in the mesh</tspan></text><text y="420.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">run it again after subdividing, on 42 corners and 80 faces:</tspan></text><text y="430.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  42 - 120 + 80 = 2</tspan></text><rect x="60.00" y="436.06" width="470.40" height="19.60" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="449.42" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="66.00">V</tspan><tspan x="73.91">-</tspan><tspan x="79.74">E</tspan><tspan x="86.58">+</tspan><tspan x="94.94">F</tspan><tspan x="101.64">=</tspan><tspan x="110.00">2</tspan><tspan x="117.16">is</tspan><tspan x="125.50">the</tspan><tspan x="140.59">cheapest</tspan><tspan x="177.74">proof</tspan><tspan x="201.55">in</tspan><tspan x="211.21">geometry</tspan><tspan x="251.77">that</tspan><tspan x="269.90">the</tspan><tspan x="284.99">shape</tspan><tspan x="310.38">in</tspan><tspan x="320.03">memory</tspan><tspan x="355.34">really</tspan><tspan x="378.80">closed</tspan><tspan x="406.13">up.</tspan></text><text y="467.55" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="63.00">Computed</tspan><tspan x="94.21">by</tspan><tspan x="102.71">two_v_demo.scratch_facts.steps_euler.</tspan><tspan x="209.55">Every</tspan><tspan x="226.05">line</tspan><tspan x="237.71">above</tspan><tspan x="256.39">is</tspan><tspan x="262.33">printed</tspan><tspan x="284.22">by</tspan><tspan x="292.71">that</tspan><tspan x="305.50">code</tspan><tspan x="320.87">when</tspan><tspan x="337.60">the</tspan><tspan x="348.34">book</tspan><tspan x="364.32">is</tspan><tspan x="370.26">built;</tspan><tspan x="385.84">none</tspan><tspan x="401.71">of</tspan><tspan x="409.11">it</tspan><tspan x="414.51">is</tspan><tspan x="420.45">typed.</tspan></text><text y="693.00" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.00" font-style="normal" font-weight="400" fill="#6 l:space="preserve"><tspan x="54.00">Built</tspan><tspan x="73.42">at</tspan><tspan x="82.23">one</tspan><tspan x="97.44">radius:</tspan><tspan x="124.65">25</tspan><tspan x="132.84">,</tspan><tspan x="136.93">65</tspan><tspan x="145.12">,</tspan><tspan x="149.21">165</tspan><tspan x="163.54">and</tspan><tspan x="179.45">250</tspan><tspan x="193.78">struts</tspan><tspan x="216.28">for</tspan><tspan x="228.75">1V</tspan><tspan x="240.81">to</tspan><tspan x="250.00">4V,</tspan><tspan x="263.64">in</tspan><tspan x="272.84">1</tspan><tspan x="276.93">,</tspan><tspan x="281.03">2</tspan><tspan x="285.12">,</tspan><tspan x="289.21">5</tspan><tspan x="295.35">and</tspan><tspan x="311.26">6</tspan><tspan x="317.40">lengths.</tspan><tspan x="348.03">Even</tspan><tspan x="368.25">frequencies</tspan><tspan x="411.80">cut</tspan><tspan x="425.08">exactly</tspan><tspan x="452.61">at</tspan><tspan x="461.43">the</tspan><tspan x="474.83">equator.</tspan></text><text y="401.76" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.40" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="54.00">Drawn</tspan><tspan x="73.89">when</tspan><tspan x="90.79">the</tspan><tspan x="101.64">book</tspan><tspan x="117.77">is</tspan><tspan x="123.77">built.</tspan><tspan x="139.50">From</tspan><tspan x="155.80">world_facts.frequency_ladder,</tspan><tspan x="240.23">which</tspan><tspan x="258.29">builds</tspan><tspan x="276.94">each</tspan><tspan x="291.81">dome</tspan><tspan x="309.87">with</tspan><tspan x="323.54">the</tspan><tspan x="334.39">simulator.</tspan></text><rect x="54.00" y="419.46" width="482.40" height="189.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="436.30" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="63.00">WORKED</tspan><tspan x="94.70">MATH</tspan></text><text y="449.39" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">Split</tspan><tspan x="86.06">every</tspan><tspan x="113.61">edge</tspan></text><text y="461.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">take one edge of the icosahedron, between corners a and b</tspan></text><text y="471.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">the halfway point is the plain average of the two:</tspan></text><text y="481.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  m = (a + b) / 2     add the coordinates, halve them</tspan></text><text y="491.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  |a| = 1.000000   |b| = 1.000000   (both on the sphere)</tspan></text><text y="501.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  |m| = 0.850650808               (NOT on the sphere)</tspan></text><text y="511.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">a straight line between two points on a ball cuts inside it:</tspan></text><text y="521.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  shortfall = 1 - 0.850651 = 0.149349192 of the radius</tspan></text><text y="531.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  on this lesson&#x27;s 9.7 ft radius dome, that is 17.38 in</tspan></text><text y="541.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">leave the 30 midpoints where they landed and you get a</tspan></text><text y="551.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  faceted icosahedron with more triangles -- not a dome</tspan></text><rect x="60.00" y="557.06" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="570.42" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="66.00">Halving</tspan><tspan x="98.33">an</tspan><tspan x="110.23">edge</tspan><tspan x="132.16">is</tspan><tspan x="140.50">the</tspan><tspan x="155.59">easy</tspan><tspan x="175.15">half</tspan><tspan x="192.27">of</tspan><tspan x="202.62">subdivision:</tspan><tspan x="251.26">those</tspan><tspan x="275.22">points</tspan><tspan x="302.05">sit</tspan><tspan x="313.51">14.93%</tspan><tspan x="343.25">of</tspan><tspan x="353.61">the</tspan><tspan x="368.70">radius</tspan><tspan x="394.96">too</tspan><tspan x="410.70">deep,</tspan><tspan x="434.71">and</tspan><tspan x="451.81">have</tspan><tspan x="472.60">to</tspan><tspan x="483.18">be</tspan></text><text y="582.02" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="66.00">pushed</tspan><tspan x="97.12">out.</tspan></text><text y="600.15" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="63.00">Computed</tspan><tspan x="94.21">by</tspan><tspan x="102.71">two_v_demo.scratch_facts.steps_midpoint.</tspan><tspan x="220.99">Every</tspan><tspan x="237.49">line</tspan><tspan x="249.15">above</tspan><tspan x="267.82">is</tspan><tspan x="273.76">printed</tspan><tspan x="295.65">by</tspan><tspan x="304.15">that</tspan><tspan x="316.94">code</tspan><tspan x="332.30">when</tspan><tspan x="349.04">the</tspan><tspan x="359.78">book</tspan><tspan x="375.76">is</tspan><tspan x="381.69">built;</tspan><tspan x="397.27">none</tspan><tspan x="413.15">of</tspan><tspan x="420.55">it</tspan><tspan x="425.95">is</tspan><tspan x="431.89">typed.</tspan></text><text y="693.00" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.00" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="527.77">17</tspan></text><text y="42.12" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="600" fill="#6c655a" xml:space="preserve"><tspan x="466.41">DIVIDE, PUSH, REPEAT</tspan></text><line x1="54.00" y1="47.62" x2="536.40" y2="47.62" stroke="#cfc7ba" stroke-width="0.35" stroke-linecap="round"/></svg></div><div class="sheet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585.00 738.00" width="585.00pt" height="738.00pt" data-page="29" data-folio="18"><rect x="0" y="0" width="585.00" height="738.00" fill="#ffffff"/><rect x="48.60" y="63.00" width="482.40" height="207.80" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="79.84" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="92.93" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">Push</tspan><tspan x="82.16">the</tspan><tspan x="99.66">midpoints</tspan><tspan x="148.27">out</tspan></text><text y="105.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">push each midpoint straight out from the centre until it</tspan></text><text y="115.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">reaches the sphere -- and that is the same divide as before:</tspan></text><text y="125.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  p = m / |m|     m chose the direction, the divide fixes the</tspan></text><text y="135.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">                  distance</tspan></text><text y="145.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  |m| = 0.850650808  -&gt;  |p| = 1.000000000</tspan></text><text y="155.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  distance travelled = 1 - |m| = 0.149349192 radii</tspan></text><text y="165.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">the direction never changes, only the distance from centre:</tspan></text><text y="175.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  each point slides along its own ray, so the face keeps its</tspan></text><text y="185.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  shape and simply bulges outward</tspan></text><text y="195.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">this is the single line that separates a subdivided</tspan></text><text y="205.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  icosahedron from a geodesic sphere</tspan></text><text y="215.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">and it is what breaks the equal edges: the four small</tspan></text><text y="225.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  triangles in each face are no longer the same size</tspan></text><rect x="54.60" y="230.60" width="470.40" height="19.60" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="243.96" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">One</tspan><tspan x="79.10">division</tspan><tspan x="111.71">by</tspan><tspan x="123.66">a</tspan><tspan x="130.53">length</tspan><tspan x="158.11">--</tspan><tspan x="167.41">p</tspan><tspan x="174.98">=</tspan><tspan x="183.34">m</tspan><tspan x="193.35">/</tspan><tspan x="199.29">|m|</tspan><tspan x="214.10">--</tspan><tspan x="223.40">is</tspan><tspan x="231.74">the</tspan><tspan x="246.83">entire</tspan><tspan x="271.89">difference</tspan><tspan x="313.60">between</tspan><tspan x="349.55">a</tspan><tspan x="356.42">faceted</tspan><tspan x="387.75">ball</tspan><tspan x="404.23">and</tspan><tspan x="421.33">a</tspan><tspan x="428.20">geodesic</tspan><tspan x="465.31">dome.</tspan></text><text y="262.09" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="57.60">Computed</tspan><tspan x="88.81">by</tspan><tspan x="97.31">two_v_demo.scratch_facts.steps_project.</tspan><tspan x="209.75">Every</tspan><tspan x="226.24">line</tspan><tspan x="237.90">above</tspan><tspan x="256.58">is</tspan><tspan x="262.52">printed</tspan><tspan x="284.41">by</tspan><tspan x="292.90">that</tspan><tspan x="305.70">code</tspan><tspan x="321.06">when</tspan><tspan x="337.79">the</tspan><tspan x="348.54">book</tspan><tspan x="364.51">is</tspan><tspan x="370.45">built;</tspan><tspan x="386.03">none</tspan><tspan x="401.90">of</tspan><tspan x="409.31">it</tspan><tspan x="414.70">is</tspan><tspan x="420.64">typed.</tspan></text><rect x="48.60" y="286.86" width="482.40" height="229.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="303.70" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="316.79" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">Two</tspan><tspan x="78.85">lengths</tspan><tspan x="115.13">fall</tspan><tspan x="131.77">out</tspan></text><text y="329.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">measure all 120 edges of the finished sphere. They fall into</tspan></text><text y="339.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">exactly two lengths -- no more, no fewer:</tspan></text><text y="349.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  SHORT = 0.546533058 R   x60</tspan></text><text y="359.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  LONG  = 0.618033989 R   x60</tspan></text><text y="369.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  R is the radius; these are multipliers, not inches</tspan></text><text y="379.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">four independent routes to that same SHORT number:</tspan></text><text y="389.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  1. subtract coordinates:  |u - v| = 0.546533058</tspan></text><text y="399.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  2. central angle: theta = acos(u . v) = 31.717474 deg</tspan></text><text y="409.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">     chord = 2 sin(theta / 2) = 0.546533058</tspan></text><text y="419.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  3. law of cosines on the same triangle: identical</tspan></text><text y="429.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  4. measure it in CAD: identical</tspan></text><text y="439.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  routes 1 and 2 differ by 1.11e-16</tspan></text><text y="449.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">the ratio nobody guesses: LONG / SHORT = 1.130826361</tspan></text><text y="459.21" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  and LONG = 0.618033989 = 1 / phi, exactly</tspan></text><rect x="54.60" y="464.46" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="477.82" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">Two</tspan><tspan x="78.93">lengths,</tspan><tspan x="112.30">30</tspan><tspan x="124.25">of</tspan><tspan x="134.60">one</tspan><tspan x="151.74">and</tspan><tspan x="168.84">35</tspan><tspan x="180.79">of</tspan><tspan x="191.14">the</tspan><tspan x="206.23">other</tspan><tspan x="229.66">in</tspan><tspan x="239.32">the</tspan><tspan x="254.41">finished</tspan><tspan x="287.81">dome,</tspan><tspan x="314.83">in</tspan><tspan x="324.49">a</tspan><tspan x="331.36">ratio</tspan><tspan x="351.94">of</tspan><tspan x="362.30">1.130826</tspan><tspan x="397.65">--</tspan><tspan x="406.96">which</tspan><tspan x="432.20">is</tspan><tspan x="440.54">not</tspan><tspan x="456.21">the</tspan><tspan x="471.30">golden</tspan></text><text y="489.42" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">ratio,</tspan><tspan x="83.27">and</tspan><tspan x="100.37">that</tspan><tspan x="118.49">surprise</tspan><tspan x="151.75">is</tspan><tspan x="160.09">the</tspan><tspan x="175.18">whole</tspan><tspan x="201.08">point.</tspan></text><text y="507.55" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  measured LONG  = 72.0 in</tspan></text><text y="481.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  measured SHORT = 63.5 in</tspan></text><text y="491.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">each board on its own implies a radius:</tspan></text><text y="501.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  R from LONG  = 72.0 / 0.618034 = 116.498 in</tspan></text><text y="511.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  R from SHORT = 63.5 / 0.546533 = 116.187 in</tspan></text><text y="521.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">they disagree, because tapes and saws are not exact</tspan></text><text y="531.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">least squares picks the radius that misses both by least:</tspan></text><text y="541.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight n><tspan x="430.39">wedge</tspan><tspan x="450.91">argument&#x27;s</tspan></text><text y="410.36" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.40" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="48.60">processing-chain</tspan><tspan x="98.14">scene,</tspan><tspan x="117.19">moved</tspan><tspan x="138.30">in.</tspan></text><rect x="48.60" y="428.06" width="482.40" height="229.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="444.90" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="457.99" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">What</tspan><tspan x="84.66">a</tspan><tspan x="92.63">tree</tspan><tspan x="113.23">keeps</tspan></text><text y="470.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">one trunk: 15.0 in at the butt, 5.5 in at the top, 60 ft usable</tspan></text><text y="480.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">bucked into 5 sections of 12 ft</tspan></text><text y="490.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">solid wood in those sections = 442.1 board feet</tspan></text><text y="500.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">SPLIT RADIALLY:</tspan></text><text y="510.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  8 sectors per section, 45 deg each = 40 full-length sectors from one tree</tspan></text><text y="520.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  the saw passes remove 51.2 bf of kerf</tspan></text><text y="530.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  wood kept = 442.1 - 51.2 = 390.9 bf = 88.4 %</tspan></text><text y="540.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  measured across whole trees on site: 88 %</tspan></text><text y="550.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">SAWN INTO TRUE TWO-BY-FOURS, same sections:</tspan></text><text y="560.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  rectangles that grid-pack inside the round = 25 pieces</tspan></text><text y="570.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  25 x 8 bf = 200.0 bf = 45.2 %</tspan></text><text y="580.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  square milling in practice recovers 50-65 %, losing wood to slabs, edgings, trim, drying degrade and planer</tspan></text><text y="590.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="65.64">shavings</tspan></text><text y="600.41" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">crosscut once, one tree gives 80 members; the dome needs 120 and 2 trees give 160</tspan></text><rect x="54.60" y="605.66" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="619.02" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">The</tspan><tspan x="77.33">same</tspan><tspan x="100.15">two</tspan><tspan x="117.27">trees</tspan><tspan x="138.76">yield</tspan><tspan x="159.80">1.95</tspan><tspan x="177.32">times</tspan><tspan x="201.00">as</tspan><tspan x="211.60">much</tspan><tspan x="235.72">usable</tspan><tspan x="263.37">structure</tspan><tspan x="300.70">split</tspan><tspan x="319.61">as</tspan><tspan x="330.21">sawn,</tspan><tspan x="354.43">because</tspan><tspan x="388.47">a</tspan><tspan x="395.35">wedge</tspan><tspan x="423.76">is</tspan><tspan x="432.10">not</tspan><tspan x="447.77">trying</tspan><tspan x="473.66">to</tspan><tspan x="484.25">be</tspan><tspan x="496.40">a</tspan></text><text y="630.62" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">rectangle</tspan><tspan x="99.41">and</tspan><tspan x="116.51">so</tspan><tspan x="127.75">throws</tspan><tspan x="156.77">none</tspan><tspan x="178.93">of</tspan><tspan x="189.29">the</tspan><tspan x="204.38">round</tspan><tspan x="230.28">away.</tspan></text><text y="648.75" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="57.60">Computed</tspan><tspan x="88.81">by</tspan><tspan x="97.31">two_v_demo.wedge_why_facts.steps_yield.</tspan><tspan x="216.17">Every</tspan><tspan x="232.66">line</tspan><tspan x="244.32">above</tspan><tspan x="263.00">is</tspan><tspan x="268.94">printed</tspan><tspan x="290.83">by</tspan><tspan x="299.32">that</tspan><tspan x="312.11">code</tspan><tspan x="327.48">when</tspan><tspan x="344.21">the</tspan><tspan x="354.95">book</tspan><tspan x="370.93">is</tspan><tspan x="376.87">built;</tspan><tspan x="392.45">none</tspan><tspan x="408.32">of</tspan><tspan x="415.72">it</tspan><tspan x="421.12">is</tspan><tspan x="427.06">typed.</tspan></text><text y="693.00" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.00" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="48.60">68</tspan></text><text y="42.12" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="600" fill="#6c655a" xml:space="preserve"><tspan x="48.60">DOMOLOGY · BOOK TWO · THE JOURNEY</tspan></text><line x1="48.60" y1="47.62" x2="531.00" y2="47.62" stroke="#cfc7ba" stroke-width="0.35" stroke-linecap="round"/></svg></div><div class="sheet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585.00 738.00" width="585.00pt" height="738.00pt" data-page="80" data-folio="69"><rect x="0" y="0" width="585.00" height="738.00" fill="#ffffff"/><rect x="54.00" y="63.00" width="482.40" height="269.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="79.84" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="63.00">WORKED</tspan><tspan x="94.70">MATH</tspan></text><text y="92.93" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">The</tspan><tspan x="82.40">machines</tspan><tspan x="127.82">you</tspan><tspan x="147.38">never</tspan><tspan x="175.29">buy</tspan></text><text y="105.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">what has to happen to a log before it can hold a roof up:</tspan></text><text y="115.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  BOTH  fell and buck            chainsaw</tspan></text><text y="125.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">        identical in both, so it cancels</tspan></text><text y="135.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  SAWN  primary breakdown        SAWMILL</tspan></text><text y="145.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">        wedge path splits radially with the same chainsaw</tspan></text><text y="155.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  SAWN  edging                   EDGER</tspan></text><text y="165.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">        there is no waney edge to remove from a split face</tspan></text><text y="175.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  SAWN  drying and grading       kiln / grader</tspan></text><text y="185.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">        wedges are used green; the shell is not a graded-lumber assembly</tspan></text><text y="195.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  SAWN  surfacing to dimension   PLANING MILL</tspan></text><text y="205.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">        the sawn faces come off the split already flat and already exact</tspan></text><text y="215.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  BOTH  crosscut to length       crosscut saw</tspan></text><text y="225.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">        one square cut, both paths</tspan></text><text y="235.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  BOTH  end joinery              compound saw / jig</tspan></text><text y="245.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">        sawn path measures two compound ends; wedge path cuts one butt and flush-cuts the head in place</tspan></text><text y="255.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">machines the wedge path never buys, feeds or houses: 3</tspan></text><text y="265.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  SAWMILL, EDGER, PLANING MILL</tspan></text><text y="275.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">what is left on the wedge side is one chainsaw and a flat board</tspan></text><rect x="60.00" y="280.60" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="293.96" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="66.00">The</tspan><tspan x="82.73">dome</tspan><tspan x="107.67">removes</tspan><tspan x="143.14">3</tspan><tspan x="150.30">whole</tspan><tspan x="176.20">machines</tspan><tspan x="215.38">from</tspan><tspan x="236.63">the</tspan><tspan x="251.72">chain,</tspan><tspan x="277.03">and</tspan><tspan x="294.13">it</tspan><tspan x="301.87">can</tspan><tspan x="317.83">only</tspan><tspan x="337.03">do</tspan><tspan x="349.74">that</tspan><tspan x="367.87">because</tspan><tspan x="401.91">a</tspan><tspan x="408.78">triangulated</tspan><tspan x="459.08">shell</tspan><tspan x="479.28">does</tspan><tspan x="500.30">not</tspan></text><text y="305.56" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="66.00">care</tspan><tspan x="84.63">whether</tspan><tspan x="119.04">its</tspan><tspan x="130.49">sticks</tspan><tspan x="154.25">are</tspan><tspan x="168.83">rectangular.</tspan></text><text y="323.69" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="63.00">Computed</tspan><tspan x="94.21">by</tspan><tspan x="102.71">two_v_demo.wedge_why_facts.steps_mills.</tspan><tspan x="221.14">Every</tspan><tspan x="237.63">line</tspan><tspan x="249.30">above</tspan><tspan x="267.97">is</tspan><tspan x="273.91">printed</tspan><tspan x="295.80">by</tspan><tspan x="304.30">that</tspan><tspan x="317.09">code</tspan><tspan x="332.45">when</tspan><tspan x="349.19">the</tspan><tspan x="359.93">book</tspan><tspan x="375.90">is</tspan><tspan x="381.84">built;</tspan><tspan x="397.42">none</tspan><tspan x="413.29">of</tspan><tspan x="420.70">it</tspan><tspan x="426.10">is</tspan><tspan x="432.03">typed.</tspan></text><rect x="54.00" y="348.46" width="482.40" height="279.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="365.30" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="63.00">WORKED</tspan><tspan x="94.70">MATH</tspan></text><text y="378.39" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">Fifteen</tspan><tspan x="97.03">hands</tspan><tspan x="126.99">between</tspan><tspan x="168.67">the</tspan><tspan x="186.16">tree</tspan><tspan x="206.76">and</tspan><tspan x="226.59">the</tspan><tspan x="244.09">rack</tspan></text><text y="390.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">a stud on a rack has been sold and handled this many times:</tspan></text><text y="400.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">   1. timber broker        sells the standing timber</tspan></text><text y="410.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">   2. logging contractor   fells and skids it</tspan></text><text y="420.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">   3. log haulier          trucks it to the mill yard</tspan></text><text y="430.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">   4. log scaler           measures and grades the log</tspan></text><text y="440.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">   5. headrig sawyer       breaks the log down</tspan></text><text y="450.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">   6. edger operator       squares the waney sides</tspan></text><text y="460.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">   7. trimmer operator     squares the ends</tspan></text><text y="470.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">   8. kiln operator        dries it to a moisture spec</tspan></text><text y="480.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">   9. lumber grader        stamps a grade on it</tspan></text><text y="490.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  10. planing mill         surfaces four sides to dimension</tspan></text><text y="500.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  11. bundler              packs and wraps a unit</tspan></text><text y="510.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  12. mill sales           sells the unit</tspan></text><text y="520.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  13. freight broker       books the flatbed</tspan></text><text y="530.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  14. distributor          holds stock and breaks bulk</tspan></text><text y="540.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  15. retail yard          sells you one stick</tspan></text><text y="550.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">then sales tax: $8.88 on the rack becomes $10.00 paid</tspan></text><text y="560.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">every one of the 15 took a margin, and every margin is in that price</tspan></text><text y="570.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">the wedge path is: fell the tree, rip the trunk, use the wood</tspan></text><rect x="60.00" y="576.06" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y= 432.13">of</tspan><tspan x="439.54">it</tspan><tspan x="444.93">is</tspan><tspan x="450.87">typed.</tspan></text><text y="693.00" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.00" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="527.77">69</tspan></text><text y="42.12" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="600" fill="#6c655a" xml:space="preserve"><tspan x="448.47">THE CUT THAT CHANGED IT</tspan></text><line x1="54.00" y1="47.62" x2="536.40" y2="47.62" stroke="#cfc7ba" stroke-width="0.35" stroke-linecap="round"/></svg></div><div class="sheet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585.00 738.00" width="585.00pt" height="738.00pt" data-page="81" data-folio="70"><rect x="0" y="0" width="585.00" height="738.00" fill="#ffffff"/><rect x="48.60" y="63.00" width="482.40" height="229.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="79.84" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="92.93" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">Four</tspan><tspan x="80.88">ways</tspan><tspan x="105.81">round</tspan></text><text y="105.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">the wedge is not symmetric, so which way it faces is a decision.</tspan></text><text y="115.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">turn it about its own long axis and the SHAPE stays the same</tspan></text><text y="125.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  while the STIFFNESS does not, because bending in a shell is</tspan></text><text y="135.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  radial: in and out along the dome&#x27;s own radius.</tspan></text><text y="145.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  DOME-IN    I  5.32 in4   S  2.05 in3</tspan></text><text y="155.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">             a pair at one seam: both points inward, toward the centre of the dome</tspan></text><text y="165.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  PANEL-IN   I  2.50 in4   S  1.63 in3</tspan></text><text y="175.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">             a pair at one seam: points apart, each into the middle of its own triangle</tspan></text><text y="185.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  DOME-OUT   I  5.32 in4   S  2.05 in3</tspan></text><text y="195.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">             a pair at one seam: both points outward, away from the centre, at the sky</tspan></text><text y="205.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  PANEL-OUT  I  2.50 in4   S  1.63 in3</tspan></text><text y="215.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">             a pair at one seam: points toward each other, across the seam</tspan></text><text y="225.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">area is 6.28 in2 in all four -- rotation moves no wood</tspan></text><text y="235.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">but S runs 1.63 to 2.05 in3, a factor of 1.25</tspan></text><rect x="54.60" y="240.60" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="253.96" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">Pointing</tspan><tspan x="95.76">the</tspan><tspan x="110.85">wedge</tspan><tspan x="139.26">at</tspan><tspan x="149.25">the</tspan><tspan x="164.34">dome&#x27;s</tspan><tspan x="194.36">centre</tspan><tspan x="221.22">puts</tspan><tspan x="240.65">1.25</tspan><tspan x="258.15">times</tspan><tspan x="281.83">the</tspan><tspan x="296.92">bending</tspan><tspan x="331.78">stiffness</tspan><tspan x="366.24">under</tspan><tspan x="391.65">the</tspan><tspan x="406.74">same</tspan><tspan x="429.55">wood,</tspan><tspan x="455.99">for</tspan><tspan x="469.68">free,</tspan><tspan x="489.39">by</tspan></text><text y="265.56" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">turning</tspan><tspan x="91.83">the</tspan><tspan x="106.92">stick</tspan><tspan x="126.96">before</tspan><tspan x="154.93">it</tspan><tspan x="162.67">goes</tspan><tspan x="183.69">down.</tspan></text><text y="283.69" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="57.60">Computed</tspan><tspan x="88.81">by</tspan><tspan x="97.31">two_v_demo.wedge_why_facts.steps_orientation.</tspan><tspan x="233.62">Every</tspan><tspan x="250.12">line</tspan><tspan x="261.78">above</tspan><tspan x="280.45">is</tspan><tspan x="286.39">printed</tspan><tspan x="308.28">by</tspan><tspan x="316.78">that</tspan><tspan x="329.57">code</tspan><tspan x="344.93">when</tspan><tspan x="361.67">the</tspan><tspan x="372.41">book</tspan><tspan x="388.39">is</tspan><tspan x="394.32">built;</tspan><tspan x="409.90">none</tspan><tspan x="425.78">of</tspan><tspan x="433.18">it</tspan><tspan x="438.58">is</tspan><tspan x="444.52">typed.</tspan></text><text y="693.00" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.00" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="48.60">70</tspan></text><text y="42.12" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6 jaVu Sans&#x27;,Arial,sans-serif" font-size="8.00" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="527.77">73</tspan></text><text y="42.12" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="600" fill="#6c655a" xml:space="preserve"><tspan x="437.22">TWO TREES AND A FORTNIGHT</tspan></text><line x1="54.00" y1="47.62" x2="536.40" y2="47.62" stroke="#cfc7ba" stroke-width="0.35" stroke-linecap="round"/></svg></div><div class="sheet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585.00 738.00" width="585.00pt" height="738.00pt" data-page="85" data-folio="74"><rect x="0" y="0" width="585.00" height="738.00" fill="#ffffff"/><rect x="48.60" y="63.00" width="482.40" height="219.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="79.84" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="92.93" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">Two</tspan><tspan x="78.85">timed</tspan><tspan x="108.02">sessions</tspan></text><text y="105.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">SESSION A, timed:</tspan></text><text y="115.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  12 wedges in 2.0 h = 6.0 wedges/hour</tspan></text><text y="125.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  $10.00 of fuel and bar oil = $5.00/hour, the only cash spent</tspan></text><text y="135.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">SESSION B, timed separately:</tspan></text><text y="145.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  6 passes at 7 ft = 42 ft of rip in 1 h, at 6 in+ of depth</tspan></text><text y="155.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  2 tanks of fuel and 2 of bar oil, one sharpening</tspan></text><text y="165.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">the two sessions measured different things, so divide them:</tspan></text><text y="175.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  42 ft/h / 6.0 wedges/h = 7.00 ft of rip per wedge</tspan></text><text y="185.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">and the geometry predicts the same number independently:</tspan></text><text y="195.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  8 sectors takes 7 passes down a 7 ft section</tspan></text><text y="205.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  7 x 7 / 8 = 6.12 ft per wedge</tspan></text><text y="215.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">the pure cutting is 88 % of the measured time; the other 12 % is rolling the log, setting up and sharpening</tspan></text><text y="225.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">planning uses 5.0 wedges/hour, 17 % below the measured rate</tspan></text><rect x="54.60" y="230.60" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="243.96" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">Two</tspan><tspan x="78.93">independent</tspan><tspan x="131.11">measurements</tspan><tspan x="190.74">and</tspan><tspan x="207.84">a</tspan><tspan x="214.72">geometric</tspan><tspan x="256.86">prediction</tspan><tspan x="299.18">agree</tspan><tspan x="323.53">to</tspan><tspan x="334.12">within</tspan><tspan x="360.69">12</tspan><tspan x="371.32">percent,</tspan><tspan x="405.45">which</tspan><tspan x="430.69">is</tspan><tspan x="439.04">why</tspan><tspan x="457.34">the</tspan><tspan x="472.43">rate</tspan></text><text y="255.56" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">below</tspan><tspan x="86.68">is</tspan><tspan x="95.02">worth</tspan><tspan x="120.61">anything</tspan><tspan x="157.54">at</tspan><tspan x="167.53">all.</tspan></text><text y="273.69" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="57.60">Computed</tspan><tspan x="88.81">by</tspan><tspan x="97.31">two_v_demo.wedge_why_facts.steps_rate.</tspan><tspan x="213.88">Every</tspan><tspan x="230.38">line</tspan><tspan x="242.04">above</tspan><tspan x="260.71">is</tspan><tspan x="266.65">printed</tspan><tspan x="288.54">by</tspan><tspan x="297.04">that</tspan><tspan x="309.83">code</tspan><tspan x="325.19">when</tspan><tspan x="341.93">the</tspan><tspan x="352.67">book</tspan><tspan x="368.65">is</tspan><tspan x="374.58">built;</tspan><tspan x="390.16">none</tspan><tspan x="406.04">of</tspan><tspan x="413.44">it</tspan><tspan x="418.84">is</tspan><tspan x="424.77">typed.</tspan></text><rect x="48.60" y="298.46" width="482.40" height="137.80" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="315.30" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="328.39" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">What</tspan><tspan x="84.66">the</tspan><tspan x="102.16">pine&#x27;s</tspan><tspan x="130.59">ladder</tspan><tspan x="162.23">rests</tspan><tspan x="186.14">on</tspan></text><text y="340.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">THE AUTHOR&#x27;S  a representative pine: 60 ft of stem, 15 in t
