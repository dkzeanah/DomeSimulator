tspan x="107.81">one</tspan><tspan x="123.02">dressed</tspan><tspan x="153.08">two-by-four</tspan><tspan x="199.00">in</tspan><tspan x="208.20">bending:</tspan><tspan x="242.21">the</tspan><tspan x="255.62">comparison</tspan><tspan x="300.33">that</tspan><tspan x="316.58">did</tspan><tspan x="331.01">not</tspan><tspan x="344.97">flatter</tspan><tspan x="368.33">the</tspan><tspan x="381.73">wedge,</tspan><tspan x="409.91">printed.</tspan></text><text y="401.76" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.40" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="48.60">Rendered</tspan><tspan x="77.31">by</tspan><tspan x="85.89">the</tspan><tspan x="96.73">DomeSim</tspan><tspan x="125.93">film</tspan><tspan x="138.25">engine</tspan><tspan x="159.18">from</tspan><tspan x="174.36">“Why</tspan><tspan x="191.16">Wedges:</tspan><tspan x="216.88">A</tspan><tspan x="222.73">Dome</tspan><tspan x="241.51">That</tspan><tspan x="255.61">Does</tspan><tspan x="271.60">Not</tspan><tspan x="284.01">Need</tspan><tspan x="300.94">a</tspan><tspan x="305.93">Sawmill”,</tspan><tspan x="332.82">chapter</tspan><tspan x="355.82">“stick”,</tspan><tspan x="376.28">85%</tspan><tspan x="390.12">through.</tspan><tspan x="415.93">The</tspan><tspan x="427.96">wedge</tspan><tspan x="448.49">argument&#x27;s</tspan><tspan x="481.82">stick</tspan><tspan x="496.09">scene.</tspan></text><rect x="48.60" y="419.46" width="482.40" height="239.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="436.30" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="449.39" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">Strong</tspan><tspan x="90.56">enough?</tspan></text><text y="461.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">a raw sector is literally 1/8 of the tree, and how strong that is depends entirely on how big the tree was.</tspan></text><text y="471.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">AT THE SIMULATOR&#x27;S 8 IN TRUNK:</tspan></text><text y="481.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  area 6.28 in2, S 2.05 in3</tspan></text><text y="491.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  = 120 % of a dressed 2x4&#x27;s area but only 67 % of its bending</tspan></text><text y="501.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">AT THE 12 IN TRUNKS ACTUALLY BEING CUT:</tspan></text><text y="511.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  area 14.14 in2, I 26.98 in4, S 6.92 in3</tspan></text><text y="521.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  = 269 % of a dressed 2x4&#x27;s area and 226 % of its bending</tspan></text><text y="531.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  and 177 % / 130 % against a FULL-dimension 2x4</tspan></text><text y="541.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">section grows with the square of the radius and bending with the</tspan></text><text y="551.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  cube, so there is a diameter where the sector overtakes the stud:</tspan></text><text y="561.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  more area than a dressed 2x4 above 7.31 in</tspan></text><text y="571.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  stiffer than a dressed 2x4 above 9.14 in</tspan></text><text y="581.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  stiffer than a FULL 2x4 above 11.00 in</tspan></text><text y="591.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">and neighbouring panels never share a stick, so all 55 interior edges carry TWO sectors:</tspan></text><text y="601.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  539 % of a stud&#x27;s area, 452 % of its bending</tspan></text><rect x="54.60" y="607.06" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="620.42" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">Under</tspan><tspan x="87.04">9.1</tspan><tspan x="99.77">inches</tspan><tspan x="126.81">of</tspan><tspan x="137.16">trunk</tspan><tspan x="160.43">the</tspan><tspan x="175.52">wedge</tspan><tspan x="203.93">is</tspan><tspan x="212.27">the</tspan><tspan x="227.36">weaker</tspan><tspan x="257.45">member</tspan><tspan x="292.66">and</tspan><tspan x="309.76">this</tspan><tspan x="326.24">argument</tspan><tspan x="366.83">fails.</tspan><tspan x="386.98">The</tspan><tspan x="403.71">trees</tspan><tspan x="425.20">being</tspan><tspan x="449.83">cut</tspan><tspan x="464.40">are</tspan><tspan x="478.98">12</tspan><tspan x="489.61">to</tspan><tspan x="500.19">15</tspan></text><text y="632.02" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">inches,</tspan><tspan x="89.71">which</tspan><tspan x="114.96">is</tspan><tspan x="123.30">why</tspan><tspan x="141.60">it</tspan><tspan x="149.34">does</tspan><tspan x="170.36">not.</tspan></text><text y="650.15" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.30" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="57.60">Computed</tspan><tspan x="88.81">by</tspan><tspan x="97.31">two_v_demo.wedge_why_facts.steps_structure.</tspan><tspan x="227.74">Every</tspan><tspan x="244.24">line</tspan><tspan x="255.90">above</tspan><tspan x="274.57">is</tspan><tspan x="280.51">printed</tspan><tspan x="302.40">by</tspan><tspan x="310.90">that</tspan><tspan x="323.69">code</tspan><tspan x="339.05">when</tspan><tspan x="355.79">the</tspan><tspan x="366.53">book</tspan><tspan x="382.51">is</tspan><tspan x="388.44">built;</tspan><tspan x="404.02">none</tspan><tspan x="419.90">of</tspan><tspan x="427.30">it</tspan><tspan x="432.70">is</tspan><tspan x="438.64">typed.</tspan></text><text y="693.00" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.00" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="48.60">76</tspan></text><text y="42.12" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="600" fill="#6c655a" xml:space="preserve"><tspan x="48.60">DOMOLOGY · BOOK TWO · THE JOURNEY</tspan></text><line x1="48.60" y1="47.62" x2="531.00" y2="47.62" stroke="#cfc7ba" stroke-width="0.35" stroke-linecap="round"/></svg></div><div class="sheet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585.00 738.00" width="585.00pt" height="738.00pt" data-page="88" data-folio="77"><rect x="0" y="0" width="585.00" height="738.00" fill="#ffffff"/><rect x="54.00" y="63.00" width="482.40" height="289.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="79.84" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="63.00">WORKED</tspan><tspan x="94.70">MATH</tspan></text><text y="92.93" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">The</tspan><tspan x="82.40">one</tspan><tspan x="102.27">compound</tspan><tspan x="154.24">cut</tspan></text><text y="105.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">correction first. An earlier cut of this film said nothing in this</tspan></text><text y="115.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  frame is mitred. That is wrong, and it is the most important</tspan></text><text y="125.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  thing on this screen.</tspan></text><text y="135.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">the PINWHEEL removes the shared vertex: no two ends ever meet each</tspan></text><text y="145.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  other, nothing is coped, nothing is shaved to a point.</tspan></text><text y="155.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">but every butt end still lands on the SIDE of the next member, and</tspan></text><text y="165.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  that side is tilted two ways at once -- by the sector angle, and</tspan></text><text y="175.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  by the turn the member makes to close the triangle.</tspan></text><text y="185.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">so the butt is a compound cut, and it is the hardest operation in</tspan></text><text y="195.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  the build. Here is what the solve says it costs:</tspan></text><text y="205.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  BEVEL 22.500 deg on every one of 120 members</tspan></text><text y="215.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  and 22.500 = half the sector angle (22.500), set by the SPLIT, not by the dome</tspan></text><text y="225.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  MITRE takes 3 values in the whole shell:</tspan></text><text y="235.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">     34.431 deg   x 60 members</tspan></text><text y="245.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">     21.138 deg   x 30 members</tspan></text><text y="255.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">     30.000 deg   x 30 members</tspan></text><text y="265.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  largest is 34.431 deg, inside a common saw&#x27;s 50 deg swing</tspan></text><text y="275.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">the cut runs 2.23 to 2.91 in along the member, because it lands on a slope:</tspan></text><text y="285.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  the sector&#x27;s POINT reaches furthest and the bark corner least, so</tspan></text><text y="295.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="63.00">  the blank has to be long on the point side and the cut is walked from the short corner up</tspan></text><rect x="60.00" y="300.60" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="313.96" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="66.00">One</tspan><tspan x="84.50">bevel,</tspan><tspan x="109.88">locked</tspan><tspan x="137.86">at</tspan><tspan an x="150.06">into</tspan><tspan x="166.39">panels.</tspan></text><text y="401.76" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.40" font-style="normal" font-weight="400" fill="#6c655a" xml:space="preserve"><tspan x="48.60">Rendered</tspan><tspan x="77.31">by</tspan><tspan x="85.89">the</tspan><tspan x="96.73">DomeSim</tspan><tspan x="125.93">film</tspan><tspan x="138.25">engine</tspan><tspan x="159.18">from</tspan><tspan x="174.36">“Why</tspan><tspan x="191.16">Wedges:</tspan><tspan x="216.88">A</tspan><tspan x="222.73">Dome</tspan><tspan x="241.51">That</tspan><tspan x="255.61">Does</tspan><tspan x="271.60">Not</tspan><tspan x="284.01">Need</tspan><tspan x="300.94">a</tspan><tspan x="305.93">Sawmill”,</tspan><tspan x="332.82">chapter</tspan><tspan x="355.82">“bench”,</tspan><tspan x="381.00">80%</tspan><tspan x="394.84">through.</tspan><tspan x="420.65">The</tspan><tspan x="432.68">wedge</tspan><tspan x="453.21">argument&#x27;s</tspan><tspan x="486.54">bench</tspan><tspan x="505.53">scene.</tspan></text><rect x="48.60" y="419.46" width="482.40" height="209.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="436.30" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="449.39" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">One</tspan><tspan x="79.06">jig,</tspan><tspan x="95.47">forty</tspan><tspan x="120.32">panels</tspan></text><text y="461.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">40 triangles, 120 members, 120 corner joints -- all off one flat board</tspan></text><text y="471.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">the fixture comes in 12 steps and holds three things:</tspan></text><text y="481.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  a RAIL per member, set to the sawn point-axis, not the bark</tspan></text><text y="491.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  a RED and a GREEN plate that make a wrongly-turned wedge physically refuse to seat</tspan></text><text y="501.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  a FENCE at each head end, which is the plane the saw runs on</tspan></text><text y="511.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">each member arrives with ONE cut already made:</tspan></text><text y="521.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  the butt, cut to the angle its neighbour presents, batched</tspan></text><text y="531.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">and one deliberate error: the head is left 6 in too long</tspan></text><text y="541.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">three butts are pulled up, the loop closes, and only then is</tspan></text><text y="551.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  each head sawn against its fence -- unmeasured, in place</tspan></text><text y="561.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">the offcut is 60 ft per dome = 8.3 % of raw length</tspan></text><text y="571.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">and 40 panels need only 4 physically different fixtures</tspan></text><rect x="54.60" y="577.06" width="470.40" height="31.20" fill="#fbeed8" rx="2.00" ry="2.00"/><text y="590.42" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="8.60" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="60.60">Leaving</tspan><tspan x="93.13">8.3</tspan><tspan x="107.16">percent</tspan><tspan x="139.21">of</tspan><tspan x="149.56">the</tspan><tspan x="164.65">length</tspan><tspan x="192.22">as</tspan><tspan x="202.81">offcut</tspan><tspan x="228.34">is</tspan><tspan x="236.69">what</tspan><tspan x="258.22">buys</tspan><tspan x="278.92">the</tspan><tspan x="294.01">accuracy:</tspan><tspan x="332.24">error</tspan><tspan x="353.85">in</tspan><tspan x="363.50">stock</tspan><tspan x="386.39">length</tspan><tspan x="413.97">or</tspan><tspan x="424.68">butt</tspan><t idth="482.40" height="289.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="79.84" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="92.93" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">The</tspan><tspan x="77.00">one</tspan><tspan x="96.87">compound</tspan><tspan x="148.84">cut</tspan></text><text y="105.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">correction first. An earlier cut of this film said nothing in this</tspan></text><text y="115.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  frame is mitred. That is wrong, and it is the most important</tspan></text><text y="125.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  thing on this screen.</tspan></text><text y="135.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">the PINWHEEL removes the shared vertex: no two ends ever meet each</tspan></text><text y="145.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  other, nothing is coped, nothing is shaved to a point.</tspan></text><text y="155.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">but every butt end still lands on the SIDE of the next member, and</tspan></text><text y="165.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  that side is tilted two ways at once -- by the sector angle, and</tspan></text><text y="175.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  by the turn the member makes to close the triangle.</tspan></text><text y="185.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">so the butt is a compound cut, and it is the hardest operation in</tspan></text><text y="195.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  the build. Here is what the solve says it costs:</tspan></text><text y="205.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  BEVEL 22.500 deg on every one of 120 members</tspan></text><text y="215.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  and 22.500 = half the sector angle (22.500), set by the SPLIT, not by the dome</tspan></text><text y="225.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  MITRE takes 3 values in the whole shell:</tspan></text><text y="235.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">     34.431 deg   x 60 members</tspan></text><text y="245.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">     21.138 deg   x 30 members</tspan></text><text y="255.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">     30.000 deg   x 30 members</tspan></text><text y="265.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  largest is 34.431 deg, inside a common saw&#x27;s 50 deg swing</tspan></text><text y="275.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">the cut runs 2.23 to 2.91 in along the member, because it lands on a slope:</tspan></text><text y="285.35" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  the sector&#x27;s POINT reaches furthest and the bark corner least, so</tspan></text><text y="295.35" font-family="Consolas, 1">Dome</tspan><tspan x="204.69">Construction</tspan><tspan x="242.40">Masterclass”,</tspan><tspan x="280.46">chapter</tspan><tspan x="303.46">“error”,</tspan><tspan x="325.11">80%</tspan><tspan x="338.95">through.</tspan><tspan x="364.77">The</tspan><tspan x="376.79">construction</tspan><tspan x="413.51">masterclass&#x27;s</tspan><tspan x="451.72">error</tspan><tspan x="467.18">scene.</tspan></text><rect x="48.60" y="419.46" width="482.40" height="229.40" fill="#eaf4f7" rx="3.00" ry="3.00"/><text y="436.30" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="6.90" font-style="normal" font-weight="700" fill="#17779a" xml:space="preserve"><tspan x="57.60">WORKED</tspan><tspan x="89.30">MATH</tspan></text><text y="449.39" font-family="&#x27;Segoe UI&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="10.00" font-style="normal" font-weight="600" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">Bends,</tspan><tspan x="90.29">knots</tspan><tspan x="118.02">and</tspan><tspan x="137.84">small</tspan><tspan x="164.21">units</tspan></text><text y="461.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">a knot or a bend does not ruin wood. It ruins whatever length has</tspan></text><text y="471.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  to be thrown away around it -- and that length is the piece you</tspan></text><text y="481.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  were trying to make.</tspan></text><text y="491.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">this dome&#x27;s members run 5.13 to 5.90 ft, cut from 6 ft stock</tspan></text><text y="501.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">a 16 ft stick from the same trunk is 2.7 times longer</tspan></text><text y="511.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">one defect costs, out of 60 usable ft:</tspan></text><text y="521.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  short members  6 ft = 10.0 % of the tree</tspan></text><text y="531.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  long sticks   16 ft = 26.7 % of the tree</tspan></text><text y="541.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">and the trunk gives 10 short pieces against 3 long ones, so there are more places for a</tspan></text><text y="551.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="normal" font-weight="400" fill="#1c1b19" xml:space="preserve"><tspan x="57.60">  defect to fall harmlessly between</tspan></text><text y="561.81" font-family="Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Courier New&#x27;,monospace" font-size="7.30" font-style="no
