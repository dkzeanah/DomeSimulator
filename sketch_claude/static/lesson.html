<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Studio</title>
<script type="importmap">{"imports": {"three": "/static/vendor/three.module.min.js"}}</script>
<style>
  html, body { margin: 0; background: #0b0e14; color: #ece6da; font: 14px Inter, "Segoe UI", sans-serif; }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #151b24; border-bottom: 1px solid #2b3646; flex-wrap: wrap; }
  header b { font-size: 15px; }
  button, select { background: #1c2430; color: inherit; border: 1px solid #2b3646; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  input[type=range] { flex: 1; min-width: 240px; }
  #view { display: flex; justify-content: center; padding: 10px; }
  #program { max-width: 100%; max-height: calc(100vh - 70px); background: #000; }
  #gl { position: absolute; left: -99999px; }
  #status { color: #9aa4b2; }
</style>
</head>
<body>
<header>
  <b>Lesson Studio</b>
  <select id="orient"><option value="landscape">Landscape 16:9</option><option value="phone">Phone 9:16</option></select>
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="clock">0:00</span>
  <select id="chapter"></select>
  <span id="status">Loading...</span>
</header>
<div id="view"><canvas id="program"></canvas></div>
<canvas id="gl"></canvas>
<script type="module" src="/static/lesson.js"></script>
</body>
</html>
