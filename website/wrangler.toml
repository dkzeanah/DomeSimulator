# zeanahlab.com on Cloudflare Pages. Static site in dist/, the API in functions/.
# Secrets (never in this file): SESSION_SECRET, ADMIN_EMAILS, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, MAILER_TOKEN, MAIL_POSTAL_ADDRESS, OPS_TOKEN -- see SETUP.md. Locally they live in .dev.vars.

name = "zeanahlab"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"

[vars]
PUBLIC_URL = "https://www.zeanahlab.com"
# The owner's sign-in name. Not a secret: it only names the account ADMIN_EMAILS already makes
# the owner, and no one else can take it.
OWNER_USERNAME = "shortcircuiter"

# The database: subscribers, accounts, orders, the pad network, backers, plaques, salvage,
# and every member's own life account. `database_id` comes from
# `npx wrangler d1 create zeanahlab` (SETUP.md step 3).
[[d1_databases]]
binding = "DB"
database_name = "zeanahlab"
database_id = "234c083c-f869-4093-80f0-101e803d84da"
migrations_dir = "migrations"

# The book PDFs. The complete edition is ~74 MB, over Pages' 25 MB file limit, and
# the sample must sit behind the email gate -- so both live in R2, served by the API.
[[r2_buckets]]
binding = "BOOKS"
bucket_name = "zeanahlab-books"

# The films on /episodes (scripts/export_episodes.py uploads them). Staging reads the same
# store: it holds only public films, and staging never writes to it.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "zeanahlab-media"

# Workers AI (Workers Paid): reads new listings for spam, writes the Monday report's short
# reading and update drafts, answers the owner's questions from counted numbers. Runs on
# Cloudflare's own GPUs; every call is logged in ai_runs. functions/_lib/ai.ts.
[ai]
binding = "AI"

# ---------------------------------------------------------------- the staging site
# Every deployment that is not the production branch (main) is a Pages PREVIEW and uses these
# bindings instead of the ones above: its own database and its own file store, so testing never
# touches a real customer. In practice that is the `staging` branch, served at
# staging.zeanahlab.pages.dev and https://dev.zeanahlab.com behind Cloudflare Access (owner only).
#   * The data is a COPY of live, made on demand: py -3.12 scripts/staging.py refresh
#   * Its secrets are the Preview ones in Pages: SESSION_SECRET and ADMIN_EMAILS only. No Stripe
#     keys (checkout runs in test mode), no MAILER_TOKEN (the mail program never collects from
#     here, so nothing queued on staging is ever sent), no OPS_TOKEN (no clock).
#   * What passes on staging goes live with the "Promote to live" button
#     (.github/workflows/website.yml), which publishes the same build to main.
# Pages does not inherit bindings into an environment, so each one is restated here.
[env.preview.vars]
PUBLIC_URL = "https://dev.zeanahlab.com"
OWNER_USERNAME = "shortcircuiter"
TEST_CHECKOUT = "1"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "zeanahlab-staging"
# filled in by `py -3.12 scripts/staging.py setup` when it creates the database
database_id = "a609b928-4242-48c3-9886-167dc0d32d91"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "BOOKS"
bucket_name = "zeanahlab-books-staging"

[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "zeanahlab-media"

[env.preview.ai]
binding = "AI"
