# zeanahlab.com: on a pull request, build (typecheck + bundle). On a push to main that
# touches website/, build, apply D1 migrations, and deploy to Cloudflare Pages.
# Two repository secrets, set once (website/SETUP.md step 6):
#   CLOUDFLARE_API_TOKEN   -- a token with Pages:Edit and D1:Edit on this account
#   CLOUDFLARE_ACCOUNT_ID
# The site's own secrets (SESSION_SECRET, Stripe, Resend...) live in Cloudflare, not here.

name: website

on:
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]

permissions:
  contents: read

concurrency:
  # a pull request's build and the push to main never share a queue, so one cannot cancel the other
  group: website-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # The numbers are generated by the Python models and committed; CI builds from the
      # committed facts.json (regenerate locally with `npm run facts`).
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: website/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: website
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: website/dist
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply zeanahlab --remote
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name zeanahlab --branch main
